services:
  - type: web
    name: attack-on-token
    runtime: node
    plan: free
    buildCommand: npm install  # no dependencies; kept for Render's Node build step
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: ANTHROPIC_API_KEY
        sync: false            # optional: leave blank for the scripted Titan
